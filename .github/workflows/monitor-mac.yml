# Re-push 2026-10-27 to re-register cron schedule (scheduled runs never fired after creation).
name: MacBook Air Refurb Hunter

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-mac
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mac hunter (loop 50 min, check every 10 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for i in 1 2 3 4 5; do
            echo "=== check $i/5 ==="
            python -m mac.main || true
            if [ $i -lt 5 ]; then sleep 600; fi
          done

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mac_state.json || true
          git commit -m "chore: update mac state [skip ci]" || exit 0
          git push || exit 0
